name: TikTok collection
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages collection endpoint
        env:
          PAGES_URL: ${{ secrets.PAGES_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          test -n "$PAGES_URL"
          test -n "$APP_TOKEN"
          curl --fail-with-body --silent --show-error \
            -X POST "$PAGES_URL/api/collect" \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}'
